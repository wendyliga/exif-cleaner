<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXIF Cleaner</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg" />

    <meta
      name="description"
      content="Strip EXIF metadata (location, camera info, etc.) from JPEG, PNG, WebP, and AVIF fully offline with no server."
    />
    <meta name="theme-color" content="#646cff" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="EXIF Cleaner" />
    <meta
      property="og:description"
      content="Strip EXIF metadata (location, camera info, etc.) from JPEG, PNG, WebP, and AVIF fully offline with no server."
    />
    <meta property="og:image" content="./favicon.svg" />
    <meta property="og:image:width" content="32" />
    <meta property="og:image:height" content="32" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EXIF Cleaner" />
    <meta
      name="twitter:description"
      content="Strip EXIF metadata (location, camera info, etc.) from JPEG, PNG, WebP, and AVIF fully offline with no server."
    />
    <meta name="twitter:image" content="./favicon.svg" />

    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
